- id: '1780769657248'
  alias: 'Completa'
  description: ''
  triggers:
    - trigger: 'state'
      entity_id: 'switch.botao'
      to: 'pressionado'
      for:
        seconds: 2
    - trigger: 'time'
      at: '08:00:00'
  conditions:
    - condition: 'and'
      conditions:
        - condition: 'numeric_state'
          entity_id: 'sensor.temp'
          above: 24.999999
        - condition: 'not'
          conditions:
            - condition: 'state'
              entity_id: 'light.sala'
              state: 'on'
  actions:
    - choose:
        - conditions:
            - condition: 'numeric_state'
              entity_id: 'sensor.temp'
              above: 30
          sequence:
            - action: 'notify.notify'
              data:
                message: 'Quente'
      default:
        - delay:
            minutes: 1
  mode: 'restart'
