- id: '1780769868620'
  alias: 'Alerta de movimento'
  description: ''
  triggers:
    - trigger: 'state'
      entity_id: 'sensor.sala'
      to: 'on'
    - trigger: 'state'
      entity_id: 'sensor.cozinha'
      to: 'on'
  conditions:
  actions:
    - action: 'notify.notify'
      data:
        message: 'Movimento detectado!'
    - delay:
        seconds: 30
    - action: 'notify.notify'
      data:
        message: 'Fim do movimento'
  mode: 'single'
